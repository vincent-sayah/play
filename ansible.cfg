[defaults]
precedence              = all_plugins_play, groups_plugins_play, all_inventory, groups_inventory, all_plugins_inventory, groups_plugins_inventory
collections_path        = collections
roles_path              = roles
host_key_checking       = false
gathering               = smart
# Augmente le délai d’attente SSH/become : certains hôtes (obs/portail)
# peuvent mettre plus de 12 s à présenter le prompt sudo lors des installations beats.
# timeout                 = 60
# Limite le parallélisme pour éviter les timeouts de sudo sur les traitements lourds.
# forks                   = 5
display_skipped_hosts   = false

[privilege_escalation]
become                  = true
become_method           = sudo
become_ask_pass         = false

[ssh_connection]
control_path            = %(directory)s/%%h-%%r
control_path_dir        = ~/.ansible/cp
# Désactivé : le pipelining peut entrer en conflit avec sudo/become
# selon la configuration requiretty/sudoers des hôtes.
pipelining              = true
ssh_args                = -o ForwardAgent=yes
                          -o ServerAliveInterval=60s
                          -o ControlMaster=auto
                          -o ControlPersist=15m

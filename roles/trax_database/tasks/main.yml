---

## Install Database Trax LRS (always fresh)
- name: Installer une base Trax LRS vierge (forcer la réinit à chaque job)
  become: true
  vars:
    traxlrs_root: /Data/www/traxlrs
    php_path_env: "/usr/local/bin:/usr/bin:{{ ansible_env.PATH | default('') }}"
  block:
    - name: Mettre en cache la configuration
      ansible.builtin.command:
        cmd: php artisan config:cache
      args:
        chdir: "{{ traxlrs_root }}"
      environment:
        PATH: "{{ php_path_env }}"
      # Ce genre de commande peut être bruyant, on considère qu'elle ne "change" pas l'état cible
      changed_when: false
      check_mode: false

    - name: Nettoyer le cache de configuration
      ansible.builtin.command:
        cmd: php artisan config:clear
      args:
        chdir: "{{ traxlrs_root }}"
      environment:
        PATH: "{{ php_path_env }}"
      changed_when: false
      check_mode: false

    - name: Installer la base (répond automatiquement "yes" au prompt)
      ansible.builtin.command:
        cmd: php artisan database:install
        stdin: "yes\n"
      args:
        chdir: "{{ traxlrs_root }}"
      environment:
        PATH: "{{ php_path_env }}"
      # On veut explicitement marquer la tâche comme changeante à chaque run
      changed_when: true
      failed_when: result_install.rc != 0
      register: result_install
      check_mode: false

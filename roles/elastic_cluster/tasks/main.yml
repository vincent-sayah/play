---
- name: Pré-requis système
  block:
    - name: vm.max_map_count  # noqa name[casing]
      ansible.builtin.sysctl:
        name: vm.max_map_count
        value: "262144"
        state: present
        reload: true

    - name: Nofile & nproc (limites)
      copy:
        dest: /etc/security/limits.d/elasticsearch.conf
        content: |
          elasticsearch soft nofile 65535
          elasticsearch hard nofile 65535
          elasticsearch soft nproc 4096
          elasticsearch hard nproc 4096
        owner: root
        group: root
        mode: '0644'

    - name: Install nano
      package:
        name: nano
        state: present

# L’installation du RPM Elasticsearch est désormais portée par minarm.elastic.elasticsearch_install.

- name: Créer les répertoires de données
  file:
    path: "{{ item }}"
    state: directory
    owner: elasticsearch
    group: elasticsearch
    mode: "0750"
  loop: "{{ es_data_dirs }}"

- name: Déployer les certificats
  block:
    - name: Créer dossier des certificats
      file:
        path: "{{ es_certs_dir }}"
        state: directory
        owner: root
        group: elasticsearch
        mode: "0750"

    - name: Déduire es_node_key depuis le groupe nodeX si absent
      ansible.builtin.set_fact:
        es_node_key: >-
          {{ es_node_key
            | default((group_names | select('match','^node[0-9]+$') | list | first), true)
          }}

    - name: Debug - afficher group_names pour diagnostic
      ansible.builtin.debug:
        msg: "inventory={{ inventory_hostname }} group_names={{ group_names }}"

    - name: Vérifier que es_node_key est défini
      ansible.builtin.assert:
        that:
          - es_node_key is defined
          - es_node_key is match('^node[0-9]+$')
        fail_msg: "es_node_key non défini ou invalide sur {{ inventory_hostname }} (attendu node1/node2/node3)"

    - name: Copier les certificats du noeud courant
      ansible.builtin.copy:
        src: "{{ vm_file_path }}{{ es_node_key }}.{{ item }}"
        dest: "{{ es_certs_dir }}/{{ es_node_key }}.{{ item }}"
        owner: root
        group: elasticsearch
        mode: "0640"
        remote_src: true
      loop:
        - crt
        - key

    - name: Copier le CA du noeud courant
      ansible.builtin.copy:
        src: "{{ vm_file_path }}{{ ca_elastic }}"
        dest: "{{ es_certs_dir }}"
        owner: root
        group: elasticsearch
        mode: "0644"
        remote_src: true

- name: Déployer heap.options
  template:
    src: heap.options.j2
    dest: "/etc/elasticsearch/jvm.options.d/heap.options"
    owner: root
    group: elasticsearch
    mode: "0644"
  notify: Restart elasticsearch

########################################################################
# Phase 1 : bootstrap single-node sur le nœud primaire (node1)
########################################################################

- name: Déployer elasticsearch.yml en mode bootstrap (single-node) sur le noeud primaire
  template:
    src: elasticsearch.yml.j2
    dest: "{{ elastic_cluster_config_dir }}/elasticsearch.yml"
    owner: root
    group: elasticsearch
    mode: "0640"
  vars:
    es_bootstrap_mode: true
  when: inventory_hostname == groups['elasticsearch_cluster'][0]

- name: Activer et démarrer Elasticsearch (bootstrap) sur le noeud primaire
  service:
    name: "{{ elastic_cluster_service }}"
    state: started
    enabled: true
  when: inventory_hostname == groups['elasticsearch_cluster'][0]

- name: Attendre HTTP sur le nœud primaire {{ http_port }}
  ansible.builtin.uri:
    url: "{{ enable_http_tls | ternary('https', 'http') }}://{{ hostvars[groups['elasticsearch_cluster'][0]].ansible_host }}:{{ http_port }}"
    method: GET
    validate_certs: true
    ca_path: "{{ es_certs_dir }}/{{ ca_elastic }}"
    status_code: [200, 401]
    timeout: 5
    return_content: false
  register: es_http_bootstrap
  retries: 30
  delay: 3
  until: es_http_bootstrap is defined and es_http_bootstrap.status in [200, 401]
  run_once: true
  delegate_to: "{{ groups['elasticsearch_cluster'][0] }}"
  become: true

- name: Définir/valider les mots de passe intégrés (elastic, kibana_system)
  block:
    - name: Choisir l’URL ES de référence (premier nœud)
      ansible.builtin.set_fact:
        # ansible_host doit être présent dans le certificat (FQDN)
        es_cli_url: "https://{{ hostvars[groups['elasticsearch_cluster'][0]].ansible_host }}:{{ http_port }}"
      run_once: true

    - name: Définir le mot de passe de 'elastic' (obligatoire rc==0)
      ansible.builtin.shell: >
        /usr/share/elasticsearch/bin/elasticsearch-reset-password
        -u elastic -i
        --url {{ es_cli_url }}
      args:
        stdin: |
          y
          {{ elastic_password | trim }}
          {{ elastic_password | trim }}
      environment:
        ES_PATH_CONF: /etc/elasticsearch
      register: setpass_elastic
      changed_when: setpass_elastic.rc == 0
      failed_when: setpass_elastic.rc != 0
      run_once: true
      delegate_to: "{{ groups['elasticsearch_cluster'][0] }}"
      become: true
      retries: 3
      delay: 5
      until: setpass_elastic.rc == 0

    - name: Définir le mot de passe de 'kibana_system' (obligatoire rc==0)
      ansible.builtin.shell: >
        /usr/share/elasticsearch/bin/elasticsearch-reset-password
        -u kibana_system -i
        --url {{ es_cli_url }}
      args:
        stdin: |
          y
          {{ kibana_password | trim }}
          {{ kibana_password | trim }}
      environment:
        ES_PATH_CONF: /etc/elasticsearch
      register: setpass_kibana
      changed_when: setpass_kibana.rc == 0
      failed_when: setpass_kibana.rc != 0
      run_once: true
      delegate_to: "{{ groups['elasticsearch_cluster'][0] }}"
      become: true
      retries: 3
      delay: 5
      until: setpass_kibana.rc == 0

    - name: Vérifier l’auth 'elastic' sur l’URL de référence
      ansible.builtin.uri:
        url: "{{ es_cli_url }}/_security/_authenticate"
        method: GET
        user: "elastic"
        password: "{{ elastic_password | trim }}"
        force_basic_auth: true
        validate_certs: true
        ca_path: "{{ es_certs_dir }}/{{ ca_elastic }}"
        status_code: 200
      register: auth_elastic
      run_once: true
      delegate_to: "{{ groups['elasticsearch_cluster'][0] }}"

    - name: Construire l’en-tête Basic (kibana_system)
      set_fact:
        kib_basic_header: "Basic {{ ('kibana_system:' ~ (kibana_password | trim)) | b64encode }}"
      run_once: true
      delegate_to: "{{ groups['elasticsearch_cluster'][0] }}"

    - name: Vérifier l’auth kibana_system
      uri:
        url: "{{ es_cli_url }}/_security/_authenticate"
        method: GET
        headers:
          Authorization: "{{ kib_basic_header }}"
        validate_certs: true
        ca_path: "{{ es_certs_dir }}/{{ ca_elastic }}"
        status_code: 200
        timeout: 10
      register: auth_kib
      run_once: true
      delegate_to: "{{ groups['elasticsearch_cluster'][0] }}"
      retries: 5
      delay: 3
      until: auth_kib.status == 200

- name: Arrêter Elasticsearch sur le nœud primaire après bootstrap
  service:
    name: "{{ elastic_cluster_service }}"
    state: stopped
  when: inventory_hostname == (groups['elasticsearch_cluster'] | first)

########################################################################
# Phase 2 : configuration cluster et démarrage des 3 nœuds
########################################################################

- name: Déployer elasticsearch.yml en mode cluster sur tous les nœuds
  template:
    src: elasticsearch.yml.j2
    dest: "{{ elastic_cluster_config_dir }}/elasticsearch.yml"
    owner: root
    group: elasticsearch
    mode: "0640"
  # ici, on ne passe pas es_bootstrap_mode → mode cluster par défaut
  notify: Restart elasticsearch

- name: Activer et démarrer Elasticsearch en mode cluster sur tous les nœuds
  service:
    name: "{{ elastic_cluster_service }}"
    state: started
    enabled: true

- name: Attendre HTTP sur chaque nœud (mode cluster) {{ http_port }}
  ansible.builtin.uri:
    url: "{{ enable_http_tls | ternary('https', 'http') }}://{{ ansible_host }}:{{ http_port }}"
    method: GET
    validate_certs: true
    ca_path: "{{ es_certs_dir }}/{{ ca_elastic }}"
    status_code: [200, 401]
    timeout: 5
    return_content: false
  register: es_http
  retries: 30
  delay: 3
  until: es_http is defined and es_http.status in [200, 401]

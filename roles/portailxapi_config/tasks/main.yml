- name: Copy .env from template (secure perms)
  become: true
  ansible.builtin.template:
    src: templates/.env.j2
    dest: "{{ apache_www_path }}/.env"
    owner: apache
    group: apache
    mode: '0640'
    backup: true

- name: Set permissions for /Data
  become: true
  ansible.builtin.file:
    path: /Data
    mode: '0755'

- name: Check if APP_KEY is already set
  become: true
  ansible.builtin.shell: grep -E '^APP_KEY=base64:.+$' "{{ apache_www_path }}/.env"
  register: appkey_check
  changed_when: false
  failed_when: false

- name: Generate Laravel APP_KEY value if missing
  become: true
  become_user: apache
  ansible.builtin.command: php artisan key:generate --show --force --no-interaction
  args:
    chdir: "{{ apache_www_path }}"
  environment:
    PATH: "/usr/local/bin:/usr/bin:{{ ansible_env.PATH | default('') }}"
  register: appkey_generate
  when: appkey_check.rc != 0
  changed_when: false

- name: Extract generated APP_KEY
  ansible.builtin.set_fact:
    generated_app_key: "{{ appkey_generate.stdout_lines | select('match', '^base64:.+') | first }}"
  when: appkey_check.rc != 0

- name: Write generated APP_KEY in .env
  become: true
  ansible.builtin.lineinfile:
    path: "{{ apache_www_path }}/.env"
    regexp: '^APP_KEY='
    line: "APP_KEY={{ generated_app_key }}"
    owner: apache
    group: apache
    mode: '0640'
  when: appkey_check.rc != 0

- name: Verify APP_KEY is now set
  become: true
  ansible.builtin.shell: grep -E '^APP_KEY=base64:.+$' "{{ apache_www_path }}/.env"
  register: appkey_verify
  changed_when: false
  failed_when: appkey_verify.rc != 0

---
# ## Configuration SElinux pour portailxapi
# # installation de policycoreutils-python-utils - outils nécessaires pour gérer les politiques SELinux
# # permettre a apache d'écrire dans portailxapi (ex. fichier laravel.log)

- name: Pré-requis SELinux pour portailxapi
  become: true
  block:
    - name: Installer les outils SELinux nécessaires
      ansible.builtin.package:
        name: policycoreutils-python-utils
        state: present

    # Règle persistante (semanage fcontext)
    - name: Définir la règle fcontext pour {{ apache_www_path }}
      community.general.sefcontext:
        target: "{{ apache_www_path }}(/.*)?"
        setype: httpd_sys_rw_content_t
        state: present

    # Dry-run pour savoir si restorecon ferait des changements
    - name: Vérifier si un restorecon est nécessaire (dry-run)
      ansible.builtin.command: restorecon -nRv {{ apache_www_path }}/
      register: restorecon_dry
      changed_when: false
      failed_when: false

    # Appliquer le contexte uniquement si nécessaire
    - name: Appliquer le contexte SELinux
      ansible.builtin.command: restorecon -Rv {{ apache_www_path }}/
      when: restorecon_dry.stdout | length > 0
      changed_when: true

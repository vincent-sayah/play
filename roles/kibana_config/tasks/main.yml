---
- name: Création repertoire certs
  ansible.builtin.file:
    path: "{{ kibana_certs_dir }}"
    state: directory
    owner: kibana
    group: kibana
    mode: "0750"

# copie CA.crt d'elastic dans config kibana
- name: Deploy Elasticsearch CA de /tmp/
  ansible.builtin.copy:
    src: "{{ kibana_elasticsearch_ca_src }}"
    dest: "{{ kibana_elasticsearch_ca_path }}"
    owner: kibana
    group: kibana
    mode: "0644"
    remote_src: true
  when: kibana_elasticsearch_ca_src | length > 0

# Copie CA dans le trust store système
- name: Copier la CA d'Elasticsearch dans /etc/pki/ca-trust/source/anchors
  ansible.builtin.copy:
    src: "{{ kibana_elasticsearch_ca_src }}"
    dest: "/etc/pki/ca-trust/source/anchors/{{ kibana_elasticsearch_ca_src | basename }}"
    owner: root
    group: root
    mode: "0644"
    remote_src: true
  when: kibana_elasticsearch_ca_src | length > 0
  notify: Mettre à jour le magasin CA

- name: Copier /tmp/CA_CHAIN_XAPI_MN.crt dans /etc/pki/ca-trust/source/anchors/
  ansible.builtin.copy:
    src: "{{ vm_file_path }}{{ ca_chain_xapi }}"
    dest: /etc/pki/ca-trust/source/anchors/{{ ca_chain_xapi }}
    owner: root
    group: root
    mode: "0644"
    remote_src: true
  notify: Mettre à jour le magasin CA

# copie kibana.crt
- name: Deploy kibana.crt de /tmp/
  ansible.builtin.copy:
    src: "{{ kibana_elasticsearch_crt_src }}"
    dest: "{{ kibana_cert_path }}"
    owner: kibana
    group: kibana
    mode: "0644"
    remote_src: true
  when: kibana_elasticsearch_crt_src | length > 0

# copie kibana.key
- name: Deploy kibana.key de /tmp/
  ansible.builtin.copy:
    src: "{{ kibana_elasticsearch_key_src }}"
    dest: "{{ kibana_key_path }}"
    owner: kibana
    group: kibana
    mode: "0644"
    remote_src: true
  when: kibana_elasticsearch_key_src | length > 0

- name: Render /etc/kibana/kibana.yml
  ansible.builtin.template:
    src: kibana.yml.j2
    dest: "{{ kibana_config_path }}"
    owner: root
    group: kibana
    mode: "0640"
  notify: Restart Kibana

# Config SELinux
- name: Lister les booleans SELinux disponibles
  command: getsebool -a
  register: selinux_bools
  changed_when: false
- name: Activer SELinux httpd_can_network_connect
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true
- name: Activer SELinux httpd_can_network_connect_ssl si disponible
  ansible.posix.seboolean:
    name: httpd_can_network_connect_ssl
    state: true
    persistent: true
  when: "'httpd_can_network_connect_ssl' in selinux_bools.stdout"

# Ajouter l'entrée DNS Kibana dans /etc/hosts
- name: Ajouter l'entrée DNS Kibana dans /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ ansible_facts['default_ipv4']['address'] }} {{ alias_dns_kibana }}.{{ zone_url }}"
    state: present
    insertafter: EOF
    create: false
    owner: root
    group: root
    mode: "0644"

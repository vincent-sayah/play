- name: Corriger les droits Laravel, reconstruire les caches et redémarrer les services
  become: true
  block:
    - name: Créer les répertoires Laravel nécessaires
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: apache
        group: apache
        mode: "0775"
      loop:
        - "{{ apache_www_path }}/storage"
        - "{{ apache_www_path }}/storage/app"
        - "{{ apache_www_path }}/storage/app/public"
        - "{{ apache_www_path }}/storage/framework"
        - "{{ apache_www_path }}/storage/framework/cache"
        - "{{ apache_www_path }}/storage/framework/cache/data"
        - "{{ apache_www_path }}/storage/framework/sessions"
        - "{{ apache_www_path }}/storage/framework/views"
        - "{{ apache_www_path }}/storage/logs"
        - "{{ apache_www_path }}/bootstrap/cache"

    - name: Donner la propriété de storage et bootstrap/cache à apache
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: apache
        group: apache
        recurse: true
      loop:
        - "{{ apache_www_path }}/storage"
        - "{{ apache_www_path }}/bootstrap/cache"

    - name: Donner les droits 775 à storage et bootstrap/cache
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0775"
        recurse: true
      loop:
        - "{{ apache_www_path }}/storage"
        - "{{ apache_www_path }}/bootstrap/cache"

    - name: Supprimer les anciens fichiers de cache Laravel avant artisan
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ portailxapi_cache_files }}"

    - name: Vérifier le lien symbolique public/storage
      ansible.builtin.stat:
        path: "{{ apache_www_path }}/public/storage"
        follow: false
      register: portailxapi_public_storage

    - name: Arrêter si public/storage existe mais n'est pas un lien symbolique
      ansible.builtin.fail:
        msg: >-
          {{ apache_www_path }}/public/storage existe mais n'est pas un lien symbolique.
          Suppression automatique refusée pour éviter une perte de données.
      when:
        - portailxapi_public_storage.stat.exists
        - not portailxapi_public_storage.stat.islnk

    - name: Supprimer l'ancien lien symbolique public/storage s'il est incorrect
      ansible.builtin.file:
        path: "{{ apache_www_path }}/public/storage"
        state: absent
      when:
        - portailxapi_public_storage.stat.exists
        - portailxapi_public_storage.stat.islnk
        - portailxapi_public_storage.stat.lnk_target | default('') != '../storage/app/public'

    - name: Créer le lien symbolique relatif Laravel public/storage
      ansible.builtin.file:
        src: ../storage/app/public
        dest: "{{ apache_www_path }}/public/storage"
        state: link
        owner: apache
        group: apache
        follow: false

    - name: Nettoyer les caches Laravel
      ansible.builtin.command:
        argv:
          - php
          - artisan
          - optimize:clear
      args:
        chdir: "{{ apache_www_path }}"
      register: portailxapi_optimize_clear
      changed_when: "'Clearing cached bootstrap files' in portailxapi_optimize_clear.stdout"

    - name: Recréer le cache de configuration Laravel
      ansible.builtin.command:
        argv:
          - php
          - artisan
          - config:cache
      args:
        chdir: "{{ apache_www_path }}"
      register: portailxapi_config_cache
      changed_when: "'Configuration cached successfully' in portailxapi_config_cache.stdout"

    - name: Recréer le cache des routes Laravel
      ansible.builtin.command:
        argv:
          - php
          - artisan
          - route:cache
      args:
        chdir: "{{ apache_www_path }}"
      register: portailxapi_route_cache
      changed_when: "'Routes cached successfully' in portailxapi_route_cache.stdout"

    - name: Remettre Laravel en ligne
      ansible.builtin.command:
        argv:
          - php
          - artisan
          - up
      args:
        chdir: "{{ apache_www_path }}"
      register: portailxapi_artisan_up
      changed_when: "'Application is now live' in portailxapi_artisan_up.stdout"
      failed_when:
        - portailxapi_artisan_up.rc != 0
        - "'Application is already up' not in portailxapi_artisan_up.stdout"

    - name: Remettre la propriété apache après génération des caches
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: apache
        group: apache
        recurse: true
      loop:
        - "{{ apache_www_path }}/storage"
        - "{{ apache_www_path }}/bootstrap/cache"

    - name: Redémarrer php-fpm
      ansible.builtin.systemd:
        name: php-fpm
        state: restarted

    - name: Redémarrer httpd
      ansible.builtin.systemd:
        name: httpd
        state: restarted

---
#####################################################################
# INSTALLATION ET CONFIGURATION REPMGR
#####################################################################


#####################################################################
# FACTS
#####################################################################

- name: Gather facts
  hosts: all
  gather_facts: true
  tasks: []


#####################################################################
# INSTALLATION REPMGR
#####################################################################

- name: Récupération de repmgr sur Medusa
  hosts: database
  become: true

  environment:
    MINARM_ATF_REPO_LIVRABLE_BASEURL: "{{ medusa_url }}"

  collections:
    - minarm.gds

  roles:
    - role: repmgr_medusa


#####################################################################
# CONFIGURATION REPMGR PRIMARY
#####################################################################

- name: Configuration repmgr.conf primary
  hosts: postgresql_primary
  become: true

  collections:
    - minarm.gds

  roles:
    - role: config_repmgr_primary


#####################################################################
# CONFIGURATION REPMGR STANDBY
#####################################################################

- name: Configuration repmgr.conf standby
  hosts: postgresql_replica
  become: true

  collections:
    - minarm.gds

  roles:
    - role: config_repmgr_standby


#####################################################################
# CALCUL DES IP REPMGR
#####################################################################

- name: Calculer les adresses PostgreSQL utilisées par repmgr
  hosts: database
  become: true

  tasks:

    - name: Calculer IP primary et standby
      ansible.builtin.set_fact:

        repmgr_primary_ip: >-
          {{
            (
              hostvars[
                groups['postgresql_primary'][0]
              ]['ansible_facts']['default_ipv4']['address']
              |
              default(
                hostvars[
                  groups['postgresql_primary'][0]
                ]['ansible_default_ipv4']['address']
              )
            )
            | mandatory
          }}

        repmgr_standby_ip: >-
          {{
            (
              hostvars[
                groups['postgresql_replica'][0]
              ]['ansible_facts']['default_ipv4']['address']
              |
              default(
                hostvars[
                  groups['postgresql_replica'][0]
                ]['ansible_default_ipv4']['address']
              )
            )
            | mandatory
          }}

    - name: Afficher les adresses utilisées par repmgr
      ansible.builtin.debug:
        msg:
          - "Primary={{ repmgr_primary_ip }}"
          - "Standby={{ repmgr_standby_ip }}"


#####################################################################
# .PGPASS REPMGR
#
# repmgr.conf utilise l'adresse IP des nœuds PostgreSQL.
# Le compte postgres doit donc disposer des credentials repmgr/repl.
#####################################################################

- name: Configurer le fichier pgpass repmgr
  hosts: database
  become: true

  tasks:

    - name: Créer le fichier .pgpass utilisé par repmgr
      ansible.builtin.copy:
        dest: /var/lib/pgsql/.pgpass
        owner: postgres
        group: postgres
        mode: "0600"
        content: |
          {{ repmgr_primary_ip }}:{{ postgresql_port }}:{{ postgres_bdd_repmgr }}:{{ postgres_user_repmgr }}:{{ repmgr_user_password }}
          {{ repmgr_standby_ip }}:{{ postgresql_port }}:{{ postgres_bdd_repmgr }}:{{ postgres_user_repmgr }}:{{ repmgr_user_password }}
          127.0.0.1:{{ postgresql_port }}:{{ postgres_bdd_repmgr }}:{{ postgres_user_repmgr }}:{{ repmgr_user_password }}
          {{ repmgr_primary_ip }}:{{ postgresql_port }}:replication:{{ postgres_user_repmgr }}:{{ repmgr_user_password }}
          {{ repmgr_standby_ip }}:{{ postgresql_port }}:replication:{{ postgres_user_repmgr }}:{{ repmgr_user_password }}
      no_log: true


#####################################################################
# LOG REPMGR
#####################################################################

- name: Configure repmgr log file
  hosts: database
  become: true

  tasks:

    - name: Création du fichier repmgr.log avec permissions sûres
      ansible.builtin.file:
        path: /var/log/repmgr.log
        state: touch
        owner: postgres
        group: postgres
        mode: "0640"
        modification_time: preserve
        access_time: preserve

    - name: Contexte SELinux adapté pour le log repmgr
      ansible.builtin.file:
        path: /var/log/repmgr.log
        setype: var_log_t

    - name: Garantir les permissions du log repmgr
      ansible.builtin.file:
        path: /var/log/repmgr.log
        owner: postgres
        group: postgres
        mode: "0640"


#####################################################################
# PRIMARY : VERIFICATION POSTGRESQL
#####################################################################

- name: Vérifier PostgreSQL primary avant enregistrement repmgr
  hosts: postgresql_primary
  become: true

  tasks:

    - name: S'assurer que PostgreSQL primary est démarré
      ansible.builtin.systemd:
        name: postgresql-17
        state: started
        enabled: true

    - name: Attendre PostgreSQL primary sur 5432
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: 5432
        state: started
        delay: 1
        timeout: 60

    - name: Vérifier la connexion repl vers la base repmgr du primary
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/psql
          - -h
          - "{{ repmgr_primary_ip }}"
          - -p
          - "{{ postgresql_port | string }}"
          - -U
          - "{{ postgres_user_repmgr }}"
          - -d
          - "{{ postgres_bdd_repmgr }}"
          - -Atqc
          - "SELECT 1;"
      environment:
        PGPASSFILE: /var/lib/pgsql/.pgpass
      register: repmgr_primary_connection
      changed_when: false
      retries: 10
      delay: 3
      until:
        - repmgr_primary_connection.rc == 0
        - repmgr_primary_connection.stdout | trim == "1"


#####################################################################
# ENREGISTREMENT PRIMARY
#####################################################################

- name: Enregistrer le primaire dans repmgr seulement si nécessaire
  hosts: postgresql_primary
  become: true

  tasks:

    - name: Vérifier si le primary est déjà enregistré
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/repmgr
          - -f
          - /etc/repmgr/17/repmgr.conf
          - node
          - status
      environment:
        PGPASSFILE: /var/lib/pgsql/.pgpass
      register: repmgr_primary_status
      changed_when: false
      failed_when: false

    - name: Enregistrer le primary si nécessaire
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/repmgr
          - -f
          - /etc/repmgr/17/repmgr.conf
          - primary
          - register
          - -F
      environment:
        PGPASSFILE: /var/lib/pgsql/.pgpass
      when: >-
        repmgr_primary_status.rc != 0
        or
        'not registered'
        in
        (
          (
            repmgr_primary_status.stdout
            ~
            repmgr_primary_status.stderr
          )
          | lower
        )
      changed_when: true


#####################################################################
# DETERMINER SI DB2 DOIT ETRE CLONE
#####################################################################

- name: Déterminer si db2 doit être cloné
  hosts: postgresql_replica
  become: true

  tasks:

    - name: Vérifier la présence de PG_VERSION sur db2
      ansible.builtin.stat:
        path: "{{ postgresql_data_dir }}/PG_VERSION"
      register: repmgr_standby_pg_version

    - name: Vérifier la présence de standby.signal sur db2
      ansible.builtin.stat:
        path: "{{ postgresql_data_dir }}/standby.signal"
      register: repmgr_standby_signal

    - name: Déterminer si un clone de db2 est nécessaire
      ansible.builtin.set_fact:
        repmgr_standby_clone_required: >-
          {{
            (repmgr_force_standby_clone | default(false) | bool)
            or
            (not repmgr_standby_pg_version.stat.exists)
          }}

    - name: Afficher la décision de clonage
      ansible.builtin.debug:
        msg:
          - "PG_VERSION présent={{ repmgr_standby_pg_version.stat.exists }}"
          - "standby.signal présent={{ repmgr_standby_signal.stat.exists }}"
          - "force clone={{ repmgr_force_standby_clone | default(false) | bool }}"
          - "clone nécessaire={{ repmgr_standby_clone_required }}"


#####################################################################
# PREPARATION ET CLONE DB2
#####################################################################

- name: Préparer et éventuellement cloner db2
  hosts: postgresql_replica
  become: true

  tasks:

    #################################################################
    # SERVICES
    #################################################################

    - name: Collecter les services de db2
      ansible.builtin.service_facts:

    - name: Stopper repmgr avant reclonage
      ansible.builtin.systemd:
        name: repmgr-17
        state: stopped
      when:
        - repmgr_standby_clone_required | bool
        - "'repmgr-17.service' in ansible_facts.services"

    - name: Stopper PostgreSQL avant reclonage
      ansible.builtin.systemd:
        name: postgresql-17
        state: stopped
      when:
        - repmgr_standby_clone_required | bool

    #################################################################
    # VAULT AGENT
    #
    # Les certificats PostgreSQL sont dans PGDATA/ssl.
    # Vault Agent doit être arrêté avant suppression de PGDATA,
    # sinon il recrée immédiatement le répertoire ssl.
    #################################################################

    - name: Stopper Vault Agent avant reclonage
      ansible.builtin.systemd:
        name: vault-agent
        state: stopped
      when:
        - repmgr_standby_clone_required | bool
        - "'vault-agent.service' in ansible_facts.services"

    #################################################################
    # NETTOYAGE AVANT CLONE
    #################################################################

    - name: Supprimer PGDATA avant reclonage
      ansible.builtin.file:
        path: "{{ postgresql_data_dir }}"
        state: absent
      when:
        - repmgr_standby_clone_required | bool

    - name: Supprimer tbs_data avant reclonage
      ansible.builtin.file:
        path: "{{ postgres_path_data }}/tbs_data"
        state: absent
      when:
        - repmgr_standby_clone_required | bool

    - name: Vérifier que PGDATA est absent
      ansible.builtin.stat:
        path: "{{ postgresql_data_dir }}"
      register: repmgr_pgdata_before_clone
      when:
        - repmgr_standby_clone_required | bool

    - name: Vérifier que Vault Agent n'a pas recréé PGDATA
      ansible.builtin.assert:
        that:
          - not repmgr_pgdata_before_clone.stat.exists
        fail_msg: >-
          {{ postgresql_data_dir }} a été recréé avant
          repmgr standby clone.
          Vérifier que Vault Agent est réellement arrêté.
        success_msg: >-
          PGDATA est correctement absent avant le clone.
      when:
        - repmgr_standby_clone_required | bool

    #################################################################
    # CLONE
    #################################################################

    - name: Exécuter repmgr standby clone
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/repmgr
          - -h
          - "{{ repmgr_primary_ip }}"
          - -U
          - "{{ postgres_user_repmgr }}"
          - -d
          - "{{ postgres_bdd_repmgr }}"
          - -f
          - /etc/repmgr/17/repmgr.conf
          - standby
          - clone
          - --copy-external-config-files
          - -F
      environment:
        PGPASSFILE: /var/lib/pgsql/.pgpass
      register: repmgr_standby_clone_result
      changed_when: true
      when:
        - repmgr_standby_clone_required | bool


#####################################################################
# VERIFICATION DU DATADIR DB2
#####################################################################

- name: Vérifier le cluster PostgreSQL de db2
  hosts: postgresql_replica
  become: true

  tasks:

    - name: Vérifier PG_VERSION après préparation
      ansible.builtin.stat:
        path: "{{ postgresql_data_dir }}/PG_VERSION"
      register: repmgr_pg_version_after_clone

    - name: Vérifier standby.signal après préparation
      ansible.builtin.stat:
        path: "{{ postgresql_data_dir }}/standby.signal"
      register: repmgr_standby_signal_after_clone

    - name: Vérifier que db2 possède PG_VERSION
      ansible.builtin.assert:
        that:
          - repmgr_pg_version_after_clone.stat.exists
        fail_msg: >-
          PG_VERSION est absent de {{ postgresql_data_dir }}.
          db2 ne possède pas de cluster PostgreSQL valide.

    - name: Vérifier la présence de standby.signal
      ansible.builtin.assert:
        that:
          - repmgr_standby_signal_after_clone.stat.exists
        fail_msg: >-
          standby.signal est absent de {{ postgresql_data_dir }}.
          Le serveur existe mais n'est pas configuré comme standby.
          Si un reclonage volontaire est nécessaire,
          relancer AAP avec : repmgr_force_standby_clone=true


#####################################################################
# CERTIFICAT VAULT ET TLS DB2
#####################################################################

- name: Configurer le certificat et TLS PostgreSQL de db2
  hosts: postgresql_replica
  become: true

  collections:
    - minarm.gds

  tasks:

    - name: Générer ou vérifier le certificat PostgreSQL standby avec Vault
      ansible.builtin.import_tasks:
        file: tasks/get_postgresql_vault_cert.yml

    - name: Appliquer TLS PostgreSQL standby
      ansible.builtin.import_tasks:
        file: tasks/apply_postgresql_tls.yml

    #################################################################
    # NETTOYAGE DES CERTIFICATS DU PRIMARY COPIES PAR PG_BASEBACKUP
    #################################################################

    - name: Calculer le CN Vault du primary
      ansible.builtin.set_fact:
        postgresql_primary_vault_cn: >-
          {{
            hostvars[
              groups['postgresql_primary'][0]
            ].ansible_host
            | lower
          }}

    - name: Supprimer les certificats du primary présents sur db2
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ postgresql_ssl_dir }}/{{ postgresql_primary_vault_cn }}.pem"
        - "{{ postgresql_ssl_dir }}/{{ postgresql_primary_vault_cn }}.key"
        - "{{ postgresql_ssl_dir }}/{{ postgresql_primary_vault_cn }}_ca_chain.pem"
      when:
        - postgresql_primary_vault_cn != postgresql_vault_expected_cn

    #################################################################
    # VERIFIER QUE POSTGRESQL DB2 EST DISPONIBLE
    #################################################################

    - name: S'assurer que PostgreSQL 17 est démarré sur db2
      ansible.builtin.systemd:
        name: postgresql-17
        state: started
        enabled: true

    - name: Attendre que PostgreSQL écoute localement sur 5432
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: 5432
        state: started
        delay: 1
        timeout: 60

    #################################################################
    # VERIFICATION DU ROLE STANDBY
    #################################################################

    - name: Vérifier que db2 est réellement en recovery
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/psql
          - -Atqc
          - "SELECT pg_is_in_recovery();"
      register: postgresql_db2_recovery
      changed_when: false

    - name: Vérifier que db2 est bien un standby PostgreSQL
      ansible.builtin.assert:
        that:
          - postgresql_db2_recovery.stdout | trim == "t"
        fail_msg: >-
          db2 est démarré mais n'est pas en mode standby.
          pg_is_in_recovery()={{ postgresql_db2_recovery.stdout | trim }}.
          Aucun enregistrement repmgr ne sera effectué.
          Si db2 doit être reconstruit depuis db1,
          utiliser repmgr_force_standby_clone=true.
        success_msg: >-
          db2 est bien démarré en mode standby.

    #################################################################
    # TEST DE LA CONNEXION EXACTE UTILISEE PAR REPMGR
    #################################################################

    - name: Vérifier la connexion repl vers la base repmgr de db2
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/psql
          - -h
          - "{{ repmgr_standby_ip }}"
          - -p
          - "{{ postgresql_port | string }}"
          - -U
          - "{{ postgres_user_repmgr }}"
          - -d
          - "{{ postgres_bdd_repmgr }}"
          - -Atqc
          - "SELECT 1;"
      environment:
        PGPASSFILE: /var/lib/pgsql/.pgpass
      register: repmgr_standby_connection
      changed_when: false
      retries: 10
      delay: 3
      until:
        - repmgr_standby_connection.rc == 0
        - repmgr_standby_connection.stdout | trim == "1"

    #################################################################
    # ENREGISTREMENT REPMGR DB2
    #################################################################

    - name: Vérifier le statut repmgr du standby
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/repmgr
          - -f
          - /etc/repmgr/17/repmgr.conf
          - node
          - status
      environment:
        PGPASSFILE: /var/lib/pgsql/.pgpass
      register: repmgr_standby_status
      changed_when: false
      failed_when: false

    - name: Afficher le résultat de repmgr node status
      ansible.builtin.debug:
        msg:
          - "rc={{ repmgr_standby_status.rc }}"
          - "stdout={{ repmgr_standby_status.stdout }}"
          - "stderr={{ repmgr_standby_status.stderr }}"

    - name: Enregistrer le standby si nécessaire
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/repmgr
          - -f
          - /etc/repmgr/17/repmgr.conf
          - standby
          - register
          - -F
      environment:
        PGPASSFILE: /var/lib/pgsql/.pgpass
      when: >-
        repmgr_standby_status.rc != 0
        or
        'not registered'
        in
        (
          (
            repmgr_standby_status.stdout
            ~
            repmgr_standby_status.stderr
          )
          | lower
        )
      changed_when: true

    #################################################################
    # VERIFICATION APRES ENREGISTREMENT
    #################################################################

    - name: Vérifier le statut final du standby dans repmgr
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/repmgr
          - -f
          - /etc/repmgr/17/repmgr.conf
          - node
          - status
      environment:
        PGPASSFILE: /var/lib/pgsql/.pgpass
      register: repmgr_standby_final_status
      changed_when: false


#####################################################################
# SERVICES REPMGR
#####################################################################

- name: Enable et demarrer repmgr-17 service
  hosts: database
  become: true

  tasks:

    - name: Enable et demarrer repmgr-17 service
      ansible.builtin.systemd:
        name: repmgr-17
        enabled: true
        state: started


#####################################################################
# REPMGRD
#####################################################################

- name: Execute daemon repmgrd
  hosts: database
  become: true
  become_user: postgres

  tasks:

    - name: Vérifier si repmgrd est déjà actif
      become: true
      ansible.builtin.shell: >-
        pgrep -u postgres -f 'repmgrd.*repmgr.conf'
      register: repmgrd_pgrep
      changed_when: false
      failed_when: false

    - name: Démarrer repmgrd uniquement si nécessaire
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/repmgrd
          - -f
          - /etc/repmgr/17/repmgr.conf
          - start
      environment:
        PGPASSFILE: /var/lib/pgsql/.pgpass
      when:
        - repmgrd_pgrep.rc != 0
      changed_when: true


#####################################################################
# SCRIPT CLUSTER
#####################################################################

- name: Créer le répertoire /opt/script_cluster_postgres
  hosts: database
  become: true

  tasks:

    - name: Créer le répertoire /opt/script_cluster_postgres
      ansible.builtin.file:
        path: /opt/script_cluster_postgres
        state: directory
        mode: "0755"


- name: Script configure_cluster_standby
  hosts: database
  become: true

  roles:
    - role: config_repmgr_script

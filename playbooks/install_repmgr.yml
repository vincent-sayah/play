## copier le rpm repmgr repmgr de medusa dans fichier /tmp
## installer localement repmgr
## donner les droits d'execution du binaire repmgr
- name: Gather facts
  hosts: all
  gather_facts: true
  tasks: []

- name: Récupération de repmgr sur Medusa
  hosts: database
  become: true
  environment:
    MINARM_ATF_REPO_LIVRABLE_BASEURL: "{{ medusa_url }}"
  collections:
    - minarm.gds
  roles:
    - role: repmgr_medusa

# configuration de repmgr sur la DB primary
- name: Configuration repmgr.conf
  hosts: postgresql_primary
  become: true
  collections:
    - minarm.gds
  roles:
    - role: config_repmgr_primary

# configuration de repmgr sur la DB standby
- name: Configuration repmgr.conf
  hosts: postgresql_replica
  become: true
  collections:
    - minarm.gds
  roles:
    - role: config_repmgr_standby

# configuration log file repmgr
- name: Configure repmgr log file
  hosts: database
  become: true
  tasks:
    - name: Création du fichier repmgr.log avec permissions sûres
      ansible.builtin.file:
        path: /var/log/repmgr.log
        state: touch
        owner: postgres
        group: postgres
        mode: '0640'
        modification_time: preserve
        access_time: preserve

    - name: Contexte SELinux adapté pour un fichier de log
      ansible.builtin.file:
        path: /var/log/repmgr.log
        setype: var_log_t

    - name: Modification proprietaire log file repmgr
      file:
        path: /var/log/repmgr.log
        owner: postgres
        group: postgres

    - name: Modification permissions repmgr log
      file:
        path: /var/log/repmgr.log
        mode: '0640'

# Enregistrement du serveur principal (idempotent)
- name: Enregistrer le primaire dans repmgr seulement si nécessaire
  hosts: postgresql_primary
  become: true
  tasks:
    - name: Vérifier si le nœud est déjà enregistré
      become: true
      become_user: postgres
      ansible.builtin.command: /usr/pgsql-17/bin/repmgr -f /etc/repmgr/17/repmgr.conf node status
      register: repmgr_status
      changed_when: false
      failed_when: false  # si non enregistré, la commande peut retourner rc!=0

    - name: Enregistrer le nœud primaire (uniquement si non enregistré)
      become: true
      become_user: postgres
      ansible.builtin.command: /usr/pgsql-17/bin/repmgr -f /etc/repmgr/17/repmgr.conf primary register -F
      when: repmgr_status.rc != 0 or ('not registered' in (repmgr_status.stdout | lower))
      changed_when: true

# clonage du serveur standby avec le serveur primaire
- name: Repmgr standby clone sur le serveur db2
  hosts: postgresql_replica
  become: true
  tasks:
    # stopper postgresql-17 sur la DB standby
    - name: Stopper le service PostgreSQL 17
      systemd:
        name: postgresql-17
        state: stopped

# Nettoyer les rep data du standby avant clonage
- name: Nettoyer complètement le standby PostgreSQL (db2)
  hosts: postgresql_replica
  become: true
  tasks:
    - name: Supprimer complètement /var/lib/pgsql/17/data
      file:
        path: "{{ postgres_path_data }}/data"
        state: absent

    - name: Supprimer complètement /var/lib/pgsql/17/tbs_data
      file:
        path: "{{ postgres_path_data }}/tbs_data"
        state: absent

    - name: Supprimer le fichier standby.signal si présent
      file:
        path: "{{ postgres_path_data }}/data/standby.signal"
        state: absent

    # Executer le clonage du serveur DB standby
    - name: Exécuter la commande repmgr standby clone (idempotent)
      become: true
      become_user: postgres
      ansible.builtin.command: >
        /usr/pgsql-17/bin/repmgr
        -h "{{ (hostvars[(groups['postgresql_primary'] | first)]['ansible_facts']['default_ipv4']['address']
               | default(hostvars[(groups['postgresql_primary'] | first)]['ansible_default_ipv4']['address'])) | mandatory }}"
        -U "{{ postgres_user_repmgr }}"
        -d "{{ postgres_bdd_repmgr }}"
        -f /etc/repmgr/17/repmgr.conf
        standby clone --copy-external-config-files -F
      args:
        # Ne lance le clone que si le datadir n'a pas déjà été initialisé
        creates: "{{ postgresql_data_dir | default('/var/lib/pgsql/17/data') }}/PG_VERSION"

    - name: Générer le certificat PostgreSQL standby avec Vault
      ansible.builtin.import_tasks:
        file: tasks/get_postgresql_vault_cert.yml

    - name: Appliquer TLS PostgreSQL standby après repmgr clone
      ansible.builtin.import_tasks:
        file: tasks/apply_postgresql_tls.yml
    
    - name: Calculer le CN du primary copié pendant le clone
      ansible.builtin.set_fact:
        postgresql_primary_vault_cn: >-
          {{
            hostvars[groups['postgresql_primary'][0]].ansible_host
           | lower
          }}

    - name: Supprimer du standby les certificats copiés depuis le primary
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - >-
          {{ postgresql_ssl_dir }}/{{ postgresql_primary_vault_cn }}.pem
        - >-
          {{ postgresql_ssl_dir }}/{{ postgresql_primary_vault_cn }}.key
        - >-
          {{ postgresql_ssl_dir }}/{{ postgresql_primary_vault_cn }}_ca_chain.pem
      when:
        - postgresql_primary_vault_cn != postgresql_vault_expected_cn

      # enregistrer le serveur DB standby
    - name: Vérifier si le standby est déjà enregistré
      become: true
      become_user: postgres
      ansible.builtin.command: /usr/pgsql-17/bin/repmgr -f /etc/repmgr/17/repmgr.conf node status
      register: repmgr_status
      changed_when: false
      failed_when: false  # si non enregistré, rc != 0

    - name: Enregistrer le standby si nécessaire
      become: true
      become_user: postgres
      ansible.builtin.command: /usr/pgsql-17/bin/repmgr -f /etc/repmgr/17/repmgr.conf standby register -F
      when: repmgr_status.rc != 0 or ('not registered' in (repmgr_status.stdout | lower))
      changed_when: true

- name: Enable et demarrer repmgr-17 service
  hosts: database
  become: true
  tasks:
    - name: Enable et demarrer repmgr-17 service
      systemd:
        name: repmgr-17
        enabled: true
        state: started

- name: Execute daemon repmgrd
  hosts: database
  become: true
  become_user: postgres
  tasks:
    - name: Check if repmgrd is running
      become: true
      ansible.builtin.shell: pgrep -u postgres -f 'repmgrd.*repmgr.conf'
      register: repmgrd_pgrep
      changed_when: false
      failed_when: false

    - name: Start repmgrd only if not running
      become: true
      become_user: postgres
      ansible.builtin.command: /usr/pgsql-17/bin/repmgrd -f /etc/repmgr/17/repmgr.conf start
      when: repmgrd_pgrep.rc != 0
      changed_when: true

- name: Créer le répertoire /opt/script_cluster_postgres
  hosts: database
  become: true
  tasks:
    - name: Créer le répertoire /opt/script_cluster_postgres
      file:
        path: /opt/script_cluster_postgres
        state: directory
        mode: '0755'  # Définir les permissions du répertoire

# script configure_cluster_standby
- name: Script configure_cluster_standby
  hosts: database
  become: true
  roles:
    - role: config_repmgr_script

---
## copier le rpm repmgr de medusa dans fichier /tmp
## installer localement repmgr
## donner les droits d'execution du binaire repmgr

- name: Gather facts
  hosts: all
  gather_facts: true
  tasks: []

#####################################################################
# INSTALLATION REPMGR
#####################################################################

- name: Récupération de repmgr sur Medusa
  hosts: database
  become: true

  environment:
    MINARM_ATF_REPO_LIVRABLE_BASEURL: "{{ medusa_url }}"

  collections:
    - minarm.gds

  roles:
    - role: repmgr_medusa


#####################################################################
# CONFIGURATION PRIMARY
#####################################################################

- name: Configuration repmgr.conf primary
  hosts: postgresql_primary
  become: true
  
  collections:
    - minarm.gds

  roles:
    - role: config_repmgr_primary


#####################################################################
# CONFIGURATION STANDBY
#####################################################################

- name: Configuration repmgr.conf standby
  hosts: postgresql_replica
  become: true

  collections:
    - minarm.gds

  roles:
    - role: config_repmgr_standby


#####################################################################
# LOG REPMGR
#####################################################################

- name: Configure repmgr log file
  hosts: database
  become: true

  tasks:

    - name: Création du fichier repmgr.log avec permissions sûres
      ansible.builtin.file:
        path: /var/log/repmgr.log
        state: touch
        owner: postgres
        group: postgres
        mode: '0640'
        modification_time: preserve
        access_time: preserve

    - name: Contexte SELinux adapté pour un fichier de log
      ansible.builtin.file:
        path: /var/log/repmgr.log
        setype: var_log_t

    - name: Modification proprietaire log file repmgr
      ansible.builtin.file:
        path: /var/log/repmgr.log
        owner: postgres
        group: postgres

    - name: Modification permissions repmgr log
      ansible.builtin.file:
        path: /var/log/repmgr.log
        mode: '0640'

#####################################################################
# ENREGISTREMENT PRIMARY
#####################################################################

- name: Enregistrer le primaire dans repmgr seulement si nécessaire
  hosts: postgresql_primary
  become: true

  tasks:

    - name: Vérifier si le nœud primary est déjà enregistré
      become: true
      become_user: postgres

      ansible.builtin.command:

        argv:
          - /usr/pgsql-17/bin/repmgr
          - -f
          - /etc/repmgr/17/repmgr.conf
          - node
          - status

      register: repmgr_primary_status
      changed_when: false
      failed_when: false

    - name: Enregistrer le nœud primaire uniquement si nécessaire
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/repmgr
          - -f
          - /etc/repmgr/17/repmgr.conf
          - primary
          - register
          - -F
      when: >-
        repmgr_primary_status.rc != 0
        or
        'not registered'
        in
        (repmgr_primary_status.stdout | lower)
      changed_when: true


#####################################################################
# PREPARATION STANDBY
#####################################################################

- name: Déterminer si db2 doit être cloné
  hosts: postgresql_replica
  become: true

  tasks:

    - name: Vérifier la présence de PG_VERSION sur db2
      ansible.builtin.stat:
        path: "{{ postgresql_data_dir }}/PG_VERSION"
      register: repmgr_standby_pg_version

    - name: Vérifier la présence de standby.signal sur db2
      ansible.builtin.stat:
        path: "{{ postgresql_data_dir }}/standby.signal"
      register: repmgr_standby_signal

    - name: Déterminer si un clonage du standby est nécessaire
      ansible.builtin.set_fact:
        repmgr_standby_clone_required: >-
          {{
            (repmgr_force_standby_clone | default(false) | bool)
            or
            (not repmgr_standby_pg_version.stat.exists)
            or
            (not repmgr_standby_signal.stat.exists)
          }}

    - name: Afficher la décision de clonage du standby
      ansible.builtin.debug:
        msg:
          - "PG_VERSION présent={{ repmgr_standby_pg_version.stat.exists }}"
          - "standby.signal présent={{ repmgr_standby_signal.stat.exists }}"
          - "force clone={{ repmgr_force_standby_clone | default(false) | bool }}"
          - "clone nécessaire={{ repmgr_standby_clone_required }}"

#####################################################################
# CLONAGE STANDBY
#####################################################################

- name: Cloner le serveur standby si nécessaire
  hosts: postgresql_replica
  become: true

  tasks:

    #################################################################
    # Récupération de l'état des services
    #################################################################

    - name: Collecter les services présents sur db2
      ansible.builtin.service_facts:

      when:
        - repmgr_standby_clone_required | bool


    #################################################################
    # Arrêt des services pouvant interférer avec le clone
    #################################################################

    - name: Stopper repmgrd sur db2 avant clonage
      ansible.builtin.systemd:
        name: repmgr-17
        state: stopped

      when:
        - repmgr_standby_clone_required | bool
        - "'repmgr-17.service' in ansible_facts.services"

    - name: Stopper PostgreSQL 17 sur db2 avant clonage
      ansible.builtin.systemd:
        name: postgresql-17
        state: stopped

      when:
        - repmgr_standby_clone_required | bool


    #################################################################
    # CRITIQUE :
    #
    # Vault Agent écrit les certificats PostgreSQL dans :
    #
    # /var/lib/pgsql/17/data/ssl
    #
    # Si Vault Agent reste actif pendant la suppression de PGDATA,
    # il recrée immédiatement ce répertoire.
    #
    # pg_basebackup, exécuté comme postgres, rencontre alors :
    #
    #   ssl: File exists
    #   Permission denied
    #
    # Il faut donc arrêter Vault Agent AVANT de supprimer PGDATA.
    #################################################################

    - name: Stopper Vault Agent avant le clonage du standby
      ansible.builtin.systemd:
        name: vault-agent
        state: stopped

      when:
        - repmgr_standby_clone_required | bool
        - "'vault-agent.service' in ansible_facts.services"


    #################################################################
    # Nettoyage PGDATA
    #################################################################

    - name: Supprimer complètement PGDATA du standby
      ansible.builtin.file:
        path: "{{ postgresql_data_dir }}"
        state: absent

      when:
        - repmgr_standby_clone_required | bool


    - name: Supprimer complètement tbs_data du standby
      ansible.builtin.file:
        path: "{{ postgres_path_data }}/tbs_data"
        state: absent

      when:
        - repmgr_standby_clone_required | bool


    #################################################################
    # Vérification importante :
    #
    # On s'assure que Vault Agent n'a pas recréé PGDATA.
    #################################################################

    - name: Vérifier que PGDATA est réellement absent avant pg_basebackup
      ansible.builtin.stat:
        path: "{{ postgresql_data_dir }}"
      register: repmgr_pgdata_after_cleanup

      when:
        - repmgr_standby_clone_required | bool

    - name: Vérifier que PGDATA n'a pas été recréé avant le clone
      ansible.builtin.assert:
        that:
          - not repmgr_pgdata_after_cleanup.stat.exists

        fail_msg: >-
          {{ postgresql_data_dir }} a été recréé avant
          repmgr standby clone.
          Vérifier notamment que Vault Agent est bien arrêté.

        success_msg: >-
          PGDATA est correctement supprimé avant
          repmgr standby clone.

      when:
        - repmgr_standby_clone_required | bool

    #################################################################
    # CLONE REPMGR
    #################################################################

    - name: Exécuter repmgr standby clone
      become: true
      become_user: postgres

      ansible.builtin.command: >-
        /usr/pgsql-17/bin/repmgr
        -h "{{
          (
            hostvars[
              groups['postgresql_primary'] | first
            ]['ansible_facts']['default_ipv4']['address']
            |
            default(
              hostvars[
                groups['postgresql_primary'] | first
              ]['ansible_default_ipv4']['address']
            )
          )
          | mandatory
        }}"
        -U "{{ postgres_user_repmgr }}"
        -d "{{ postgres_bdd_repmgr }}"
        -f /etc/repmgr/17/repmgr.conf
        standby clone
        --copy-external-config-files
        -F

      register: repmgr_standby_clone_result

      changed_when: true

      when:
        - repmgr_standby_clone_required | bool


    #################################################################
    # Validation du clone
    #################################################################

    - name: Vérifier PG_VERSION après clonage
      ansible.builtin.stat:
        path: "{{ postgresql_data_dir }}/PG_VERSION"

      register: repmgr_pg_version_after_clone


    - name: Vérifier standby.signal après clonage
      ansible.builtin.stat:
        path: "{{ postgresql_data_dir }}/standby.signal"

      register: repmgr_standby_signal_after_clone


    - name: Vérifier que db2 possède un cluster PostgreSQL valide
      ansible.builtin.assert:
        that:
          - repmgr_pg_version_after_clone.stat.exists

        fail_msg: >-
          PG_VERSION est absent de
          {{ postgresql_data_dir }} après le clonage.


    - name: Vérifier que db2 est configuré comme standby
      ansible.builtin.assert:
        that:
          - repmgr_standby_signal_after_clone.stat.exists

        fail_msg: >-
          standby.signal est absent de
          {{ postgresql_data_dir }}.
          db2 n'est pas configuré comme standby.

    #################################################################
    # CERTIFICAT VAULT PROPRE A DB2
    #
    # Cette tâche reconfigure/redémarre Vault Agent APRÈS le clone.
    #################################################################

    - name: Générer ou vérifier le certificat PostgreSQL standby avec Vault
      ansible.builtin.import_tasks:
        file: tasks/get_postgresql_vault_cert.yml

    #################################################################
    # TLS PostgreSQL
    #################################################################

    - name: Appliquer TLS PostgreSQL standby
      ansible.builtin.import_tasks:
        file: tasks/apply_postgresql_tls.yml

    #################################################################
    # Suppression éventuelle des certificats du primary copiés par
    # pg_basebackup.
    #################################################################

    - name: Calculer le CN du primary copié pendant le clone
      ansible.builtin.set_fact:
        postgresql_primary_vault_cn: >-
          {{
            hostvars[
              groups['postgresql_primary'][0]
            ].ansible_host
            | lower
          }}


    - name: Supprimer du standby les certificats copiés depuis le primary
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:

        - >-
          {{ postgresql_ssl_dir }}/{{ postgresql_primary_vault_cn }}.pem

        - >-
          {{ postgresql_ssl_dir }}/{{ postgresql_primary_vault_cn }}.key

        - >-
          {{ postgresql_ssl_dir }}/{{ postgresql_primary_vault_cn }}_ca_chain.pem

      when:
        - postgresql_primary_vault_cn != postgresql_vault_expected_cn


    #################################################################
    # ENREGISTREMENT DB2
    #################################################################

    - name: Vérifier si le standby est déjà enregistré
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/repmgr
          - -f
          - /etc/repmgr/17/repmgr.conf
          - node
          - status

      register: repmgr_standby_status

      changed_when: false
      failed_when: false


    - name: Enregistrer le standby si nécessaire
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/repmgr
          - -f
          - /etc/repmgr/17/repmgr.conf
          - standby
          - register
          - -F

      when: >-
        repmgr_standby_status.rc != 0
        or
        'not registered'
        in
        (repmgr_standby_status.stdout | lower)

      changed_when: true

#####################################################################
# SERVICES REPMGR
#####################################################################

- name: Enable et demarrer repmgr-17 service
  hosts: database
  become: true

  tasks:

    - name: Enable et demarrer repmgr-17 service
      ansible.builtin.systemd:
        name: repmgr-17
        enabled: true
        state: started


#####################################################################
# REPMGRD
#####################################################################

- name: Execute daemon repmgrd
  hosts: database
  become: true
  become_user: postgres

  tasks:

    - name: Check if repmgrd is running
      become: true

      ansible.builtin.shell: >-
        pgrep -u postgres -f 'repmgrd.*repmgr.conf'
      register: repmgrd_pgrep

      changed_when: false
      failed_when: false


    - name: Start repmgrd only if not running
      become: true
      become_user: postgres

      ansible.builtin.command: >-
        /usr/pgsql-17/bin/repmgrd
        -f /etc/repmgr/17/repmgr.conf
        start

      when:
        - repmgrd_pgrep.rc != 0

      changed_when: true

#####################################################################
# SCRIPT CLUSTER
#####################################################################

- name: Créer le répertoire /opt/script_cluster_postgres
  hosts: database
  become: true

  tasks:

    - name: Créer le répertoire /opt/script_cluster_postgres
      ansible.builtin.file:
        path: /opt/script_cluster_postgres
        state: directory

        mode: '0755'


- name: Script configure_cluster_standby
  hosts: database
  become: true

  roles:
    - role: config_repmgr_script

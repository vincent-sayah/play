---
- name: Gather facts
  hosts: all
  gather_facts: true
  tasks: []

- name: Install and Configure apache portailxapi
  hosts: portailxapi
  become: true
  environment:
    MINARM_YUM_REPO_NATIONAL_ORIGIN: "{{ minarm_yum_repo_norigin }}"
    MINARM_ATF_REPO_MIDDLEWARE_BASEURL: "{{ minarm_atf_repo_mbaseurl }}"
    MINARM_ATF_REPO_LIVRABLE_BASEURL: "{{ medusa_url }}"
    MINARM_ATF_REPO_LIVRABLE_USER: "{{ artifactory_user }}"
    MINARM_ATF_REPO_LIVRABLE_PASSWORD: "{{ artifactory_password }}"

  ## Référencement des collections nécessaires
  collections:
    - minarm.gds
    - minarm.lvm
    - minarm.firewalld
    - minarm.apache
    - minarm.postgresql
    - minarm.php

  pre_tasks:
  - name: Calculer le CN attendu pour POPRTAILXAPI
    ansible.builtin.set_fact:
      xapi_expected_vault_cn: "{{ alias_dns_portailxapi }}.{{ zone_url }}"

  - name: Forcer les paramètres du certificat PORTAILXAPI
    ansible.builtin.set_fact:
      vault_agent_https_cn: "{{ xapi_expected_vault_cn }}"
      vault_agent_https_sans:
        - "{{ xapi_expected_vault_cn }}"

  - name: Vérifier que la priorité des variables AAP ne surcharge pas le CN
    ansible.builtin.assert:
      that:
        - vault_agent_https_cn == xapi_expected_vault_cn
        - xapi_expected_vault_cn in vault_agent_https_sans
      fail_msg: >-
        Le CN effectif est {{ vault_agent_https_cn }}, alors que
        {{ xapi_expected_vault_cn }} est attendu.
        Une extra-var AAP surcharge probablement la valeur du playbook.
      success_msg: >-
        Le CN Vault est correctement défini :
        {{ vault_agent_https_cn }}

  - name: Afficher les paramètres non sensibles du certificat
    ansible.builtin.debug:
      msg:
        - "CN attendu={{ xapi_expected_vault_cn }}"
        - "CN effectif={{ vault_agent_https_cn }}"
        - "SAN={{ vault_agent_https_sans }}"
        - "Certificat={{ vault_agent_https_cert }}"
        - "Clé={{ vault_agent_https_pk }}"
        - "Chaîne={{ vault_agent_https_ca_chain }}"

  ## Appel dans l'ordre d'exécution des roles minarm et des roles customs.
  roles:
    - role: minarm.lvm.lvm_install
    - role: minarm.firewalld.firewalld_install
    - role: vault_get_cert
    - role: minarm.apache.apache_install
    - role: start_apache
    - role: portailxapi_medusa
    - role: minarm.php.php_install
    - role: portailxapi_config
    - role: portailxapi_selinux
    - role: clean_tmp_portailxapi

- name: Configure database on PostgreSQL primary
  hosts: postgresql_primary
  become: true
  environment:
    MINARM_ATF_REPO_LIVRABLE_BASEURL: "{{ medusa_url }}"
    MINARM_ATF_REPO_LIVRABLE_USER: "{{ artifactory_user }}"
    MINARM_ATF_REPO_LIVRABLE_PASSWORD: "{{ artifactory_password }}"

  collections:
    - minarm.gds
    - minarm.postgresql

  roles:
    - role: portailxapi_database

- name: Configure permission and clear cache laravel
  hosts: portailxapi
  become: true

  roles:
    - role: portailxapi_permissions

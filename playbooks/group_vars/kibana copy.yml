---

#######################################
##              LVM                  ##
##                                   ##
#######################################

## Définition des groupes de volumes logiques (Volume Groups) pour la LV_KIBANA

# Sur une VM dédiée Kibana, le service lui-même ne stocke pas beaucoup de données locales :
# Les dashboards, index patterns, spaces, etc. sont stockés dans Elasticsearch (cluster derrière HAProxy).
# Localement, Kibana n’écrit que quelques fichiers temporaires et des logs (/var/log/kibana/).
#
# Kibana communique DIRECTEMENT avec les nœuds Elasticsearch.
# Il ne passe pas par HAProxy.

lvm_volume_groups:
  - vg: 'VG_DATA'
    pvs: ['/dev/sdb']
    logical_volumes:
      - lv: LV_KIBANA
        size: 100%VG
        mount: '/var/log/kibana'
        mount_state: 'mounted'
        state: 'present'
        fs_type: 'xfs'

#############################################
##                Metier                   ##
##                                         ##
#############################################

## Packages placés dans Médusa nécéssaire pour l'architecture TRAX
## OAUTH2

oauth2_tar: "oauth2-proxy-v7.15.3.linux-amd64"
oauth2_extension: ".tar.gz"
oauth2_medusa_file_path: "{{ identifiant_zp_repo }}-generic/oauth2_proxy/{{ oauth2_tar }}{{ oauth2_extension }}"

#############################################
##       KIBANA CERTIFICATES / VAULT       ##
##                                         ##
#############################################

# les certificats sont générés par minarm.gds.vault_get_cert.

vault_agent_https_ca_chain: "/etc/pki/tls/ca_chain/{{ alias_dns_kibana }}.{{ zone_url }}_ca_chain.pem"
vault_agent_https_cert: "/etc/pki/tls/certs/{{ alias_dns_kibana }}.{{ zone_url }}.pem"
vault_agent_https_pk: "/etc/pki/tls/private/{{ alias_dns_kibana }}.{{ zone_url }}.key"
vault_agent_https_cn: "{{ alias_dns_kibana }}.{{ zone_url }}"
vault_agent_https_sans:
  - "{{ alias_dns_kibana }}.{{ zone_url }}"

# Le groupe kibana existe après installation du RPM Kibana.
# Le rôle vault_get_cert sera donc appelé après installation du paquet.

group_ca_chain: kibana
group_certificate: kibana
group_private_key: kibana

mode_ca_chain: "0644"
mode_certificate: "0644"
mode_private_key: "0640"

# On conserve notre propre configuration Kibana/Nginx.
# Le rôle GDS ne doit pas générer de configuration web.
web_service: none


#############################################
##               RUCHE                     ##
##                                         ##
#############################################

# Variables d'installation attendues par minarm.elastic.kibana_install
# Le rôle utilise directement kibana_package_url comme nom de paquet/URL.
# Exemple final :
#   https://artifacts.elastic.co/downloads/kibana/kibana-8.19.16-x86_64.rpm
kibana_version: "8.19.16"
kibana_package_url: "https://artifacts.elastic.co/downloads/kibana/kibana-{{ kibana_version }}-x86_64.rpm"
kibana_package: kibana
kibana_state: present
kibana_download_timeout: 300

# Path fichier de config
kibana_config_path: "/etc/kibana/kibana.yml"

# PORT
server_port_kibana: 5601

# Variables minimales attendues par minarm.elastic.kibana_install.
# La configuration finale complète reste rendue par roles/kibana_config/templates/kibana.yml.j2.
kibana_conf:
  server.port: "{{ server_port_kibana }}"
  server.host: "0.0.0.0"

############################
# Config CERT pour Kibana  #
#                          #
############################
kibana_certs_dir: "/etc/kibana/certs"

# -------------------------------------------------------------------
# CA ELASTICSEARCH
#
# ATTENTION :
# cette CA n'est PAS la chaîne du certificat Vault Kibana.
#
# Elle sert uniquement à vérifier les connexions :
#
# Kibana -> Elasticsearch
#
# Elle continue donc à être récupérée depuis Médusa.
# -------------------------------------------------------------------
kibana_elasticsearch_ca_src: "{{ vm_file_path }}{{ ca_elastic }}"
kibana_elasticsearch_ca_path: "{{ kibana_certs_dir }}/{{ ca_elastic }}"



# kibana crt et key
# kibana_elasticsearch_crt_src: "{{ vm_file_path }}{{ server_kibana_crt }}"
# kibana_elasticsearch_key_src: "{{ vm_file_path }}{{ server_kibana_key }}"
# kibana_cert_path: "{{ kibana_certs_dir }}/{{ server_kibana_crt }}"
# kibana_key_path: "{{ kibana_certs_dir }}/{{ server_kibana_key }}"

# -------------------------------------------------------------------
# CERTIFICAT SERVEUR KIBANA
#
# vault_get_cert fournit :
#
#   vault_agent_https_cert
#   vault_agent_https_ca_chain
#
# Le rôle kibana_config assemble les deux dans un fullchain.
# -------------------------------------------------------------------

kibana_cert_path: "{{ kibana_certs_dir }}/kibana-vault-fullchain.pem"

# La clé est utilisée directement depuis le répertoire géré par Vault Agent.
#
# Cela évite de maintenir une deuxième copie de la clé privée.

kibana_key_path: "{{ vault_agent_https_pk }}"


############################
# Config Nginx pour Kibana #
############################

# Stockage des certs pour Nginx (on recopie ceux déjà fournis pour Kibana)
# nginx_cert_dir: "/etc/nginx/certs"
# nginx_cert_path: "{{ nginx_cert_dir }}/{{ server_kibana_crt }}"
# nginx_key_path: "{{ nginx_cert_dir }}/{{ server_kibana_key }}"

# Nginx utilise exactement le même certificat que Kibana.

nginx_cert_dir: "{{ kibana_certs_dir }}"
nginx_cert_path: "{{ kibana_cert_path }}"
nginx_key_path: "{{ kibana_key_path }}"

nginx_conf_d_files:
  - templates/kibana.conf

# Backend Kibana (port local 5601 par défaut)
kibana_backend_host: "127.0.0.1"
kibana_backend_port: "{{ server_port_kibana | default(5601) }}"
kibana_backend_url: "https://{{ kibana_backend_host }}:{{ kibana_backend_port }}"

#####################################################################
#            Variables tenant observability                         #
#####################################################################

obs_service: kibana
obs_role: kibana

# Variable et configuration du firewall
firewalld:
  - name: "Ouverture du port 4180" # Port pour oauth2-proxy
    port: "4180/tcp"
    permanent: true
    immediate: true
    zone: "public"
  - name: "Ouverture du port 5601"
    port: "5601/tcp"
    permanent: true
    immediate: true
    zone: "public"

# HTTP -> HTTPS
server {
    listen 80;
    server_name {{ alias_dns_kibana }}.{{ zone_url }};
    return 301 https://$host$request_uri;
}

# HTTPS termination + reverse proxy to Kibana
server {
    listen 443 ssl;
    http2 on;
    server_name {{ alias_dns_kibana }}.{{ zone_url }};

    # ---------------------------------------------------------------
    # TLS PUBLIC NGINX
    #
    # Le certificat Vault contient déjà :
    #
    # - certificat Kibana
    # - intermédiaire GDS
    # - intermédiaire PICSEL
    # ---------------------------------------------------------------

    ssl_certificate {{ kibana_cert_path }};
    ssl_certificate_key {{ kibana_key_path }};
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # ---------------------------------------------------------------
    # Proxy vers Kibana
    # ---------------------------------------------------------------

    location / {
        proxy_pass {{ kibana_backend_url }};
        proxy_http_version 1.1;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # En-têtes
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # -----------------------------------------------------------
        # TLS NGINX -> KIBANA
        #
        # La connexion TCP se fait sur 127.0.0.1:5601,
        # mais le certificat est émis pour :
        #
        # integ-xapi-kibana.picsel.defense.gouv.fr
        #
        # proxy_ssl_name permet donc de vérifier le bon nom DNS.
        #
        # Le trust store système contient notamment IGC-PIC-ACR.
        # -----------------------------------------------------------

        proxy_ssl_server_name on;
        proxy_ssl_name {{ alias_dns_kibana }}.{{ zone_url }};
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate {{ nginx_kibana_trusted_ca }};

        # Timeouts
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 60s;
    }


    # Santé basique
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    access_log /var/log/nginx/kibana.access.log;
    error_log /var/log/nginx/kibana.error.log warn;
}

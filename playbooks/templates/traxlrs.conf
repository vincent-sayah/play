<VirtualHost *:443>
ServerName {{ apache_server_name }}
DocumentRoot {{apache_www_path }}/public

##Certificats SSL ##
SSLEngine on
SSLCertificateFile {{ vault_agent_https_cert }}
SSLCertificateKeyFile {{ vault_agent_https_pk }}
SSLCertificateChainFile {{ vault_agent_https_ca_chain }}

    <Directory {{apache_www_path }}/public>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Order allow,deny
        allow from all
        Require all granted
            #<FilesMatch "\.php$">
                # PHP8
                #SetHandler "proxy:fcgi://127.0.0.1:9000"
           # </FilesMatch>
    </Directory>

ErrorLog /var/log/httpd/trax-ssl_error.log
CustomLog /var/log/httpd/trax-ssl_access.log combined
</VirtualHost>

# Redirection HTTP->HTTPS
<VirtualHost *:80>
ServerName {{ apache_server_name }}
Redirect permanent / https://{{ apache_server_name }}

</VirtualHost>

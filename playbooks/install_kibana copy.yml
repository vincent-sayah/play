---
# Installation Kibana avec minarm.elastic
#
# Architecture :
#
# - certificat HTTPS Kibana généré par GDS / Vault
# - Vault Agent installé/configuré par minarm.gds.vault_get_cert
# - CA Elasticsearch conservée depuis Médusa
# - connexion directe Kibana -> cluster Elasticsearch
# - compte kibana_system / mot de passe GDS
# - Nginx reverse proxy
# - oauth2-proxy installé dans le playbook install_oauth2.yml

- name: Gather facts
  hosts: all
  gather_facts: true
  tasks: []

- name: Installer et configurer Kibana
  hosts: kibana
  become: true
  environment:
    MINARM_YUM_REPO_NATIONAL_ORIGIN: "{{ minarm_yum_repo_norigin }}"
    MINARM_ATF_REPO_MIDDLEWARE_BASEURL: "{{ minarm_atf_repo_mbaseurl }}"
    MINARM_ATF_REPO_LIVRABLE_BASEURL: "{{ medusa_url }}"
  collections:
    - minarm.gds
    - minarm.elastic
    - minarm.nginx
    - minarm.lvm
    - minarm.firewalld
  roles:
    - role: minarm.lvm.lvm_install
    - role: minarm.firewalld.firewalld_install
    - role: kibana_medusa

  tasks:
    - name: Installer Kibana avec les variables du rôle minarm.elastic.kibana_install
      # Le fichier tasks/install.yml du rôle minarm.elastic.kibana_install exécute
      # obligatoirement kibana-setup --enrollment-token. Cette étape est incompatible
      # avec l'architecture XAPI_MN en TLS PEM. On reprend donc strictement la tâche
      # d'installation documentée du rôle, avec les mêmes variables, sans lancer
      # l'enrollment automatique.
      minarm.core.adaptable.package:
        name: "{{ kibana_package_url | default(kibana_package) }}"
        state: "{{ kibana_state }}"
        url_category: middleware
        update_cache: true
        disable_gpg_check: true
      timeout: "{{ kibana_download_timeout }}"
      notify: Restart Kibana après installation compatible minarm

    - name: Activer et démarrer Kibana au démarrage
      ansible.builtin.service:
        name: kibana
        enabled: true
        daemon_reload: true
        state: started

    - name: Collecter les packages installés
      ansible.builtin.package_facts:
        manager: auto

    - name: Vérifier que le paquet Kibana est bien installé
      ansible.builtin.assert:
        that:
          - "'kibana' in ansible_facts.packages"
        fail_msg: >-
          Le paquet Kibana n'a pas été installé. Vérifier kibana_package_url,
          kibana_version et les accès au dépôt middleware.

    - name: Appliquer le fragment de configuration du rôle minarm.elastic.kibana_install
      ansible.builtin.include_role:
        name: minarm.elastic.kibana_install
        tasks_from: config

    - name: Appliquer la configuration Kibana XAPI_MN
      ansible.builtin.include_role:
        name: kibana_config

    - name: Installer et configurer Nginx
      ansible.builtin.include_role:
        name: minarm.nginx.nginx_install

    - name: Nettoyer les fichiers temporaires Kibana
      ansible.builtin.include_role:
        name: clean_tmp_srv_kibana

  handlers:
    - name: Restart Kibana après installation compatible minarm
      ansible.builtin.service:
        name: kibana
        state: restarted

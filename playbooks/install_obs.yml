---

- name: Ajout api obs
  hosts: front
  become: true
  collections:
    - minarm.gds

  roles:
    - role: api_obs
    - role: trax_obs # Ajout dans route/web.php de trax l'Endpoint d'observabilité info

- name: Ajout service obs
  hosts: all
  become: true
  gather_facts: true
  serial: "{{ observability_serial | default(1) }}"
  strategy: linear
  vars:
    # Sécurise les rôles minarm.observability sur les hôtes qui ont un sudo lent
    # ou une configuration sudo/requiretty stricte.
    ansible_pipelining: false
    ansible_ssh_pipelining: false
    ansible_timeout: "{{ observability_become_timeout | default(60) }}"
  collections:
    - minarm.core
    - minarm.gds
    - minarm.observability

  tasks:
    - name: Vérifier que les secrets observabilité nécessaires sont déjà chargés
      ansible.builtin.assert:
        that:
          - obs_apikey_elasticsearch_tenant is defined
          - obs_apikey_elasticsearch_monitoring is defined
          - obs_apikey_service_tenant is defined
          - obs_apikey_apm is defined
          - obs_username_artifactory is defined
          - obs_password_artifactory is defined
        fail_msg: >-
          Les secrets observabilité ne sont pas tous chargés avant l'appel à
          minarm.observability.tenant_observability. Vérifier gds_secret et les variables
          obs_username_artifactory / obs_password_artifactory.

    - name: Installer et configurer la supervision tenant sans récupération GDS interne
      ansible.builtin.include_role:
        name: minarm.observability.tenant_observability

    - name: Afficher la valeur de la variable
      ansible.builtin.debug:
        msg: |
          "La valeur obs_service : {{ obs_service | default('non défini') }}"
          "La valeur obs_role : {{ obs_role | default('non défini') }}"
